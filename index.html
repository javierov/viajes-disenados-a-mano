<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu viaje, diseñado a mano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c1730);--ink:light-dark(#14213d,#eef2fb);--soft:light-dark(#5a6684,#a9b4cf);
--blue:light-dark(#1c3fa0,#7d9bf0);--blue2:light-dark(#e8eefb,#16264d);--red:#e5402b;--line:light-dark(#d6ddee,#26365f);--card:light-dark(#ffffff,#111f40)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.tiles{--h:clamp(110px,12.05vw,240px);position:relative;height:var(--h);background:#cfe9f5;overflow:hidden}
.stage{position:absolute;bottom:0;width:max(100%,calc(var(--h) * 8.3366));aspect-ratio:2576/309;left:calc((100% - max(100%,calc(var(--h) * 8.3366))) * .62)}
.stage .bg{display:block;width:100%;height:100%}
.tren{position:absolute;left:-10.29%;top:70.55%;width:78.69%;height:auto;transform:translateX(-110%);will-change:transform}
.tiles.parked .tren{transform:none}
.tiles.go .tren{animation:llega 3s cubic-bezier(.12,.62,.22,1) forwards}
@keyframes llega{from{transform:translateX(-110%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.tiles.go .tren{animation:none;transform:none}}
main{max-width:640px;margin:0 auto;padding:28px max(5vw,16px) 120px}
h1{font:400 clamp(34px,7.4vw,48px)/1.05 "DM Serif Display",Georgia,serif;margin:0 0 12px;text-wrap:balance}
h2{font:400 clamp(27px,5.8vw,34px)/1.1 "DM Serif Display",Georgia,serif;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--soft);margin:0 0 22px}
body.is-intro .pass{display:none}
body.is-intro main{padding-top:14px}
body.is-intro h1{margin-bottom:8px}
body.is-intro .lead{margin-bottom:12px}
.pass{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px;margin-bottom:26px;font-size:14px;color:var(--soft)}
.pass b{color:var(--ink);font-weight:600;white-space:nowrap}
.bar{flex:1;height:6px;background:var(--blue2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .35s}
.q{margin:0 0 24px}
.q>label,.q>.lab{display:block;font-weight:600;margin-bottom:8px}
.info{display:inline-grid;place-items:center;width:22px;height:22px;min-height:0;min-width:0;flex:none;align-self:center;box-sizing:border-box;margin-left:8px;border-radius:50%;border:1.5px solid var(--soft);background:none;color:var(--soft);font:600 13px/1 Inter,sans-serif;cursor:pointer;vertical-align:1px;padding:0}
.info[aria-expanded="true"]{background:#1c3fa0;border-color:#1c3fa0;color:#fff}
.bub{margin:4px 0 10px;padding:10px 12px;border-radius:10px;background:#eef2fb;color:#1c2a55;font-size:14px;line-height:1.45}
.hint{display:block;font-weight:400;color:var(--soft);font-size:14px;margin-top:2px}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;font:16px Inter,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus,.chip:focus-within,button:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px;border-color:var(--blue)}
.ac{position:relative}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:48px;padding:6px 8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;cursor:text}
.tagbox:focus-within{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px;border-color:var(--blue)}
.tagbox input[type=text]{flex:1 1 9em;width:auto;border:0;outline:0;padding:6px;min-height:34px;background:none}
.tagbox input:focus{outline:0}
.tag{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--blue2);color:var(--ink);font-size:15px;line-height:1.3}
.tagx{min-height:28px;width:28px;padding:0;border:0;border-radius:50%;background:none;color:var(--soft);font-size:18px;line-height:1}
.tagx:hover{background:color-mix(in srgb,var(--blue) 15%,transparent)}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(20,33,61,.14);z-index:5;overflow:hidden}
.sug button{display:flex;justify-content:space-between;gap:12px;width:100%;min-height:46px;padding:10px 14px;border:0;border-radius:0;background:none;font:500 16px Inter,system-ui,sans-serif;text-align:left;color:var(--ink)}
.sug button+button{border-top:1px solid var(--line)}
.sug button:hover,.sug button.on{background:var(--blue2)}
.sug small{color:var(--soft);font-weight:400;white-space:nowrap}
.incl{margin:2px 0 6px;padding:12px 14px;border-radius:12px;background:var(--blue2);font-size:14px;line-height:1.45}
.incl b{display:block;color:var(--blue);margin-bottom:2px}
.cgrp{font-size:13px;font-weight:600;color:var(--soft);margin:14px 0 8px}
.cgrp:first-of-type{margin-top:4px}
.cgrp+.chips{gap:6px}
.cgrp+.chips .chip{font-size:14px;padding:6px 12px;min-height:40px}
.styles{display:block}
.sty.surp{margin-bottom:12px}
.sty.surp .mock{height:44px}
.scar{position:relative}
.strack{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 2px;padding:3px 2px 6px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strack::-webkit-scrollbar{display:none}
.strack .sty{flex:0 0 calc((100% - 10px)/2.25);scroll-snap-align:start}
@media(min-width:620px){.strack .sty{flex-basis:calc((100% - 20px)/3.25)}}
.snav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.snav button{width:40px;min-height:40px;padding:0;border-radius:50%;font-size:22px;line-height:1}
.snav button:disabled{opacity:.3;cursor:default}
.sdots{display:flex;gap:5px}.sdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.sdots i.on{background:var(--blue)}
.sty{position:relative;display:flex;flex-direction:column;gap:2px;padding:8px 8px 10px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.sty input{position:absolute;opacity:0;pointer-events:none}
.sty:has(input:checked){border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.sty:has(input:checked) .sname::after{content:" ✓";color:var(--blue)}
.sty:focus-within{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px}
.mock{position:relative;display:block;height:64px;border-radius:9px;border:1px solid rgba(20,33,61,.12);overflow:hidden;margin-bottom:6px}
.mbar{position:absolute;left:8px;top:9px;width:46%;height:8px;border-radius:4px}
.mline{position:absolute;left:8px;top:24px;width:70%;height:5px;border-radius:3px;opacity:.8}
.mline.short{top:34px;width:50%}
.mpill{position:absolute;right:8px;bottom:8px;width:30%;height:12px;border-radius:6px}
.dots{position:absolute;left:8px;bottom:9px;display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.6)}
.q-mark{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:400 40px/1 "DM Serif Display",Georgia,serif;color:#1c3fa0}
.sname{font-weight:600;font-size:15px;line-height:1.25}
.sdesc{font-size:13px;color:var(--soft);line-height:1.3}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.cnt .lab{font-weight:600}
.step3{display:flex;align-items:center;gap:10px}
.step3 button{width:44px;min-height:44px;padding:0;font-size:22px;line-height:1;border-radius:50%}
.step3 output{min-width:28px;text-align:center;font-size:18px;font-weight:600}
.skip{display:block;margin:6px auto 0;border:0;background:none;color:var(--soft);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.res{margin:22px 0;display:grid;gap:12px}
.sec{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sech h3{margin:0;font:400 20px/1.2 "DM Serif Display",Georgia,serif}
.edit{min-height:40px;padding:0 14px;font-size:15px;color:var(--blue);border-color:var(--line)}
.sec dl{margin:8px 0 0;display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:4px 12px;font-size:15px}
.sec dt{color:var(--soft)}.sec dd{margin:0;white-space:pre-line}
@media(max-width:600px){.sec dl{grid-template-columns:minmax(0,1fr)}.sec dd{margin-bottom:6px}}
.rt-help{margin:0 0 14px}
.rt-tot{font-size:14px;color:var(--soft);margin:-4px 0 12px}
.rt-tot b{color:var(--ink)}.rt-tot.warn b{color:var(--red)}
.rt{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px}
.rc{border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 14px;background:var(--card)}
.rc-h{display:flex;align-items:center;gap:10px}
.rc-n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:600;font-size:14px}
.rc-c{flex:1;min-width:0;font-weight:600;line-height:1.3}
.rc-mv{display:flex;gap:6px}
.rc-mv button{width:40px;min-height:40px;padding:0;border-radius:10px;font-size:18px}
.rc-mv button:disabled{opacity:.3;cursor:default}
.rc-r{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.rc-l{font-size:14px;color:var(--soft)}
.rc-d{font-size:13px;color:var(--soft);margin-top:2px}
.rc .step3 button{width:40px;min-height:40px;font-size:20px}
.rc .step3 output{min-width:64px;font-size:15px}
.rc .chips{gap:6px}.rc .chip{min-height:38px;padding:6px 12px;font-size:14px}
.rc input[type=text]{margin-top:8px;padding:10px 12px}
.nsug{margin:10px 0 0}.nsug .chip{font:400 14px Inter,system-ui,sans-serif;min-height:40px;padding:6px 14px}
.nsug .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;background:var(--card);font-size:15px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme=dark] .chip:has(input:checked){color:#0c1730}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .chip:has(input:checked){color:#0c1730}}
.nav{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px max(5vw,16px) calc(12px + env(safe-area-inset-bottom))}
.nav div{max-width:640px;margin:0 auto;display:flex;gap:12px;justify-content:space-between}
button{font:600 16px Inter,system-ui,sans-serif;min-height:48px;padding:0 22px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.go{background:var(--red);border-color:var(--red);color:#fff;flex:1;max-width:260px;margin-left:auto}
button[hidden]{display:none}
#back[hidden]+.go{margin-right:auto}
.step{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.bar i{transition:none}}
.send{display:grid;gap:10px;margin:18px 0}
.send>button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;font-weight:600;text-decoration:none;max-width:none}
.wa{background:#1f9e55;color:#fff}.em{background:var(--blue);color:#fff}
:root[data-theme=dark] .em{color:#0c1730}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
button:disabled{opacity:.75;cursor:default}
.note a{color:var(--blue);font-weight:600}
.note{font-size:14px;color:var(--soft)}
.ok{color:#1f9e55;font-weight:600;font-size:14px;min-height:1.5em}
@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

function localMatches(qv,list){

  for(const [p,n] of list){if(n.startsWith(qv))starts.push(p);else if(n.split(/[\s,]+/).some(w=>w.startsWith(qv)))words.push(p);else if(n.includes(qv))inside.push(p)}

async function remoteMatches(q){

  const j=await r.json();

}
