<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu viaje, diseñado a mano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, personal, unhurried — a friend asking good questions before planning your trip
   IDEA: a travel journal's first page crossed with a boarding pass — one question card at a time
   PICTURE: the form itself, topped by Javier's illustrated banner; his train glides in on load and a pass-style progress strip
   COLOUR and TYPE: white ground, cobalt tile blue lead, tomato-red accent; Fraunces titles, Inter body
   LAYOUT: one calm column, max 640px; sticky Back/Next bar on phones */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c1730);--ink:light-dark(#14213d,#eef2fb);--soft:light-dark(#5a6684,#a9b4cf);
--blue:light-dark(#1c3fa0,#7d9bf0);--blue2:light-dark(#e8eefb,#16264d);--red:#e5402b;--line:light-dark(#d6ddee,#26365f);--card:light-dark(#ffffff,#111f40)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.tiles{--h:clamp(110px,12.05vw,240px);position:relative;height:var(--h);background:#cfe9f5;overflow:hidden}
.stage{position:absolute;bottom:0;width:max(100%,calc(var(--h) * 8.3366));aspect-ratio:2576/309;left:calc((100% - max(100%,calc(var(--h) * 8.3366))) * .62)}
.stage .bg{display:block;width:100%;height:100%}
.tren{position:absolute;left:-10.29%;top:70.55%;width:78.69%;height:auto;transform:translateX(-110%);will-change:transform}
.tiles.parked .tren{transform:none}
.tiles.go .tren{animation:llega 3s cubic-bezier(.12,.62,.22,1) forwards}
@keyframes llega{from{transform:translateX(-110%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.tiles.go .tren{animation:none;transform:none}}
main{max-width:640px;margin:0 auto;padding:28px max(5vw,16px) 120px}
h1{font:600 clamp(32px,7vw,46px)/1.05 Fraunces,Georgia,serif;margin:0 0 12px;text-wrap:balance}
h2{font:600 clamp(26px,5.5vw,34px)/1.1 Fraunces,Georgia,serif;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--soft);margin:0 0 22px}
.pass{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:14px;padding:10px 14px;margin-bottom:26px;font-size:14px;color:var(--soft)}
.pass b{color:var(--ink);font-weight:600;white-space:nowrap}
.bar{flex:1;height:6px;background:var(--blue2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .35s}
.q{margin:0 0 24px}
.q>label,.q>.lab{display:block;font-weight:600;margin-bottom:8px}
.hint{display:block;font-weight:400;color:var(--soft);font-size:14px;margin-top:2px}
input[type=text],input[type=email],input[type=date],input[type=number],textarea,select{width:100%;font:16px Inter,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus,.chip:focus-within,button:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px;border-color:var(--blue)}
.ac{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(20,33,61,.14);z-index:5;overflow:hidden}
.sug button{display:flex;justify-content:space-between;gap:12px;width:100%;min-height:46px;padding:10px 14px;border:0;border-radius:0;background:none;font:500 16px Inter,system-ui,sans-serif;text-align:left;color:var(--ink)}
.sug button+button{border-top:1px solid var(--line)}
.sug button:hover,.sug button.on{background:var(--blue2)}
.sug small{color:var(--soft);font-weight:400;white-space:nowrap}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;background:var(--card);font-size:15px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme=dark] .chip:has(input:checked){color:#0c1730}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .chip:has(input:checked){color:#0c1730}}
.nav{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px max(5vw,16px) calc(12px + env(safe-area-inset-bottom))}
.nav div{max-width:640px;margin:0 auto;display:flex;gap:12px;justify-content:space-between}
button{font:600 16px Inter,system-ui,sans-serif;min-height:48px;padding:0 22px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.go{background:var(--red);border-color:var(--red);color:#fff;flex:1;max-width:260px;margin-left:auto}
button[hidden]{display:none}
#back[hidden]+.go{margin-right:auto}
.step{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.bar i{transition:none}}
.send{display:grid;gap:10px;margin:18px 0}
.send a,.send button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;font-weight:600;text-decoration:none;max-width:none}
.wa{background:#1f9e55;color:#fff}.em{background:var(--blue);color:#fff}
:root[data-theme=dark] .em{color:#0c1730}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.res{margin:18px 0;border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
.res summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.res pre{white-space:pre-wrap;font:14px/1.5 Inter,system-ui,sans-serif;margin:0 0 14px}
button:disabled{opacity:.75;cursor:default}
.note a{color:var(--blue);font-weight:600}
.note{font-size:14px;color:var(--soft)}
.ok{color:#1f9e55;font-weight:600;font-size:14px;min-height:1.5em}
@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

    const typ=q.ty==="chips"?"checkbox":"radio";
    return `<fieldset class="q" style="border:0;padding:0"><legend class="lab" style="padding:0;font-weight:600;margin-bottom:8px">${esc(q.l)}${h}</legend><div class="chips">${q.o.map(o=>{

      return `<label class="chip"><input type="${typ}" name="${q.id}" value="${esc(o)}"${on?" checked":""}>${esc(o)}</label>`}).join("")}</div></fieldset>`;
  }
  if(q.ty==="place")return `<div class="q ac"><label for="${q.id}">${esc(q.l)}${h}</label><input id="${q.id}" name="${q.id}" type="text" value="${esc(v)}" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="${q.id}-sug"><div class="sug" id="${q.id}-sug" role="listbox" hidden></div></div>`;

}

async function sendNow(){
  const pb=document.getElementById("post"),ok=document.getElementById("pok"),fb=document.getElementById("fb");
  pb.disabled=true;pb.textContent="Enviando…";ok.style.color="";ok.textContent="";fb.hidden=true;
  let t0=0;try{t0=+localStorage.getItem(KEY+"-t0")||0}catch(e){}
  let id="";try{id=localStorage.getItem(KEY+"-id")||"";if(!id){id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem(KEY+"-id",id)}}catch(e){id="x"+Date.now().toString(36)}
  const body=JSON.stringify({...A,_hp:document.getElementById("web").value,_secs:t0?Math.round((Date.now()-t0)/1000):0,_id:id});
  try{
    if(!CONFIG.endpoint)throw new Error("sin conexión configurada");
    const r=await fetch(CONFIG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    let j={};try{j=await r.json()}catch(e){j={ok:r.ok}}
    if(j.ok){
      try{localStorage.setItem(KEY+"-sent",JSON.stringify({at:Date.now(),hash:JSON.stringify(A)}))}catch(e){}
      pb.textContent="Enviado ✓";ok.textContent="¡Recibido! Ya tengo tus respuestas. Te escribiré pronto.";
      document.getElementById("flead").textContent="Tus respuestas ya están enviadas. ¡Muchas gracias!";return}
    if(j.error==="espera"){pb.textContent="Enviar los cambios";ok.style.color="var(--red)";ok.textContent="Acabo de recibir un envío tuyo. Espera un minuto antes de enviar otra vez.";setTimeout(()=>pb.disabled=false,60000);return}
    throw new Error(j.error||"error");
  }catch(e){
    pb.disabled=false;pb.textContent="Intentar de nuevo";ok.style.color="var(--red)";ok.textContent="No se pudo enviar. Revisa tu conexión e inténtalo otra vez.";fb.hidden=false}
}
function collect(){
  const s=STEPS[cur];if(!s.f)return;
  for(const q of s.f){
    if(q.ty==="chips")A[q.id]=[...f.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i=>i.value);
    else if(q.ty==="radio"){const r=f.querySelector(`input[name="${q.id}"]:checked`);A[q.id]=r?r.value:""}
    else{const e=document.getElementById(q.id);if(e)A[q.id]=e.value.trim().replace(/,\s*$/,"")}
  }
  save();updIf();
}

function summary(){
  const fmt=d=>{if(!d)return"";const [y,m,dd]=d.split("-");return `${dd}/${m}/${y}`};
  let out=`CUESTIONARIO DE VIAJE – ${A.nombre||"(sin nombre)"}\n`;
  for(const s of STEPS){if(!s.f)continue;
    const lines=s.f.filter(shown).map(q=>{let v=A[q.id];if(Array.isArray(v))v=v.join(", ");if(q.ty==="date")v=fmt(v);return v?`• ${q.l.replace(/^¿|\?$/g,"")}: ${v}`:""}).filter(Boolean);
    if(lines.length)out+=`\n${s.t.toUpperCase()}\n${lines.join("\n")}\n`;}
  return out.trim();
}

const norm=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const PN=PLACES.map(p=>[p,norm(p)]);
function suggest(inp){
  const box=document.getElementById(inp.id+"-sug"),parts=inp.value.split(","),qv=norm(parts[parts.length-1]);
  if(qv.length<2){box.hidden=true;inp.setAttribute("aria-expanded","false");return}
  const starts=[],words=[],inside=[];
  for(const [p,n] of PN){if(n.startsWith(qv))starts.push(p);else if(n.split(/[\s,]+/).some(w=>w.startsWith(qv)))words.push(p);else if(n.includes(qv))inside.push(p)}
  const r=[...starts,...words,...inside].slice(0,6);
  if(!r.length){box.hidden=true;inp.setAttribute("aria-expanded","false");return}
  box.innerHTML=r.map((p,i)=>{const [a,...b]=p.split(", ");return `<button type="button" role="option" data-v="${esc(b.length?a+" ("+b.join(", ")+")":a)}"${i?"":' class="on"'}><span>${esc(a)}</span>${b.length?`<small>${esc(b.join(", "))}</small>`:""}</button>`}).join("");
  box.hidden=false;inp.setAttribute("aria-expanded","true");
}
function pick(inp,val){const parts=inp.value.split(",");parts[parts.length-1]=" "+val;inp.value=parts.join(",").replace(/^\s+/,"")+", ";
  const box=document.getElementById(inp.id+"-sug");box.hidden=true;inp.setAttribute("aria-expanded","false");inp.focus();collect()}
f.addEventListener("input",e=>{if(e.target.getAttribute("role")==="combobox")suggest(e.target)});
f.addEventListener("pointerdown",e=>{const b=e.target.closest(".sug button");if(b){e.preventDefault();pick(b.closest(".ac").querySelector("input"),b.dataset.v)}});
f.addEventListener("keydown",e=>{const t=e.target;if(t.getAttribute("role")!=="combobox")return;const box=document.getElementById(t.id+"-sug");if(box.hidden)return;
  const bs=[...box.querySelectorAll("button")];let i=bs.findIndex(b=>b.classList.contains("on"));
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();bs[i]?.classList.remove("on");i=(i+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs[i].classList.add("on")}
  else if(e.key==="Enter"){e.preventDefault();if(bs[i])pick(t,bs[i].dataset.v)}
  else if(e.key==="Escape"){box.hidden=true}});
f.addEventListener("focusout",e=>{if(e.target.getAttribute("role")==="combobox")setTimeout(()=>{const b=document.getElementById(e.target.id+"-sug");if(b)b.hidden=true},150)});
f.addEventListener("click",e=>{const t=e.target;if(t.type==="radio"&&A[t.name]===t.value){t.checked=false;A[t.name]="";save();updIf()}});
f.addEventListener("change",collect);f.addEventListener("input",()=>{clearTimeout(f._t);f._t=setTimeout(collect,400)});
const tiles=document.getElementById("tiles");
{const tr=tiles.querySelector(".tren"),go=()=>setTimeout(()=>tiles.classList.add("go"),250);tr.complete?go():tr.addEventListener("load",go,{once:true})}
nx.onclick=()=>{collect();const s=STEPS[cur];
  if(s.intro){try{if(!localStorage.getItem(KEY+"-t0"))localStorage.setItem(KEY+"-t0",Date.now())}catch(e){}}
  if(s.f){const miss=s.f.find(q=>q.req&&!A[q.id]);if(miss){const e=document.getElementById("err");e.textContent="Rellena «"+miss.l.replace(/^¿|\?$/g,"")+"» para continuar.";document.getElementById(miss.id)?.focus();return}}
  if(cur<STEPS.length-1){cur++;save();render()}};
bk.onclick=()=>{collect();if(cur>0){cur--;save();render()}};
render();
}
</script>
